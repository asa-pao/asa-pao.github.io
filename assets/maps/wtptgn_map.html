  .nodata {position:absolute; z-index:999; left:50%; bottom:30px; transform:translateX(-50%); background:rgba(255,255,255,.95); padding:6px 14px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.3); display:none;}
  .mapwrap {position:relative;}
  .foot {padding:10px 20px 16px; font-size:.8rem; color:var(--muted);}

const MONTHS = ['Jan.','Feb.','Mar.','Apr.','May','Jun.','Jul.','Aug.','Sept.','Oct.','Nov.','Dec.'];
const RAMP = ['#ffffcc','#ffeda0','#fed976','#feb24c','#fd8d3c','#fc4e2a','#e31a1c','#bd0026','#800026'];

// shared color scale bc sharing is caring
let vmin = Infinity, vmax = -Infinity;
Object.values(DATA).forEach(fc => fc.features.forEach(f => {
  vmin = Math.min(vmin, f.properties.v); vmax = Math.max(vmax, f.properties.v);
}));
function color(v) {
  // square-root stretch so the one big outlier doesn't wash out literally everything else
  const t = Math.sqrt((v - vmin) / (vmax - vmin));
  const x = Math.min(Math.max(t, 0), 1) * (RAMP.length - 1);
  const i = Math.floor(x), j = Math.min(i + 1, RAMP.length - 1), f = x - i;
  const a = parseInt(RAMP[i].slice(1), 16), b = parseInt(RAMP[j].slice(1), 16);
  const mix = s => Math.round(((a >> s) & 255) * (1 - f) + ((b >> s) & 255) * f);
  return `rgb(${mix(16)},${mix(8)},${mix(0)})`;
}

// bathmapth
const map = L.map('map', {minZoom: 2, maxZoom: 17, worldCopyJump: true, center: [51, -100], zoom: 3});

// OpenTopoMap: single tile.opentopomap.org host
// Needs a Referer header, so serve over http(s)
const openTopo = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  referrerPolicy: 'origin',
  attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
});

// fallback in case they hit you with a double flank and OpenTopoMap says 'nahhhh'
const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 17,
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, USGS, NRCAN and others'
});

openTopo.addTo(map);

// esri historic swap out like never seen before
let tileErrors = 0, swapped = false;
openTopo.on('tileerror', () => {
  tileErrors++;
  if (tileErrors >= 4 && !swapped) {
    swapped = true;
    map.removeLayer(openTopo);
    esriTopo.addTo(map);
    esriTopo.bringToBack();
    const n = document.getElementById('notice');
    n.textContent = 'OpenTopoMap refused the tiles (likely a 403 from opening the file directly), so the Esri topo basemap is shown instead.';
    n.style.display = 'block';
    setTimeout(() => n.style.display = 'none', 9000);
 }
});

L.control.layers({'OpenTopoMap': openTopo}, null, {position: 'topright'}).addTo(map);

// ---- month layers ----
let current = null;
function styleFor(f) {
  return {fillColor: color(f.properties.v), fillOpacity: 0.7, color: '#444', weight: 0.8};
}
const layers = {};
Object.keys(DATA).forEach(m => {
  layers[m] = L.geoJSON(DATA[m], {
    style: styleFor,
    onEachFeature: (f, lyr) => {
      lyr.bindTooltip(`<b>${MONTHS[m - 1]}</b><br>Normalized occurrences: ${f.properties.v.toFixed(3)}`, {sticky: true});
      lyr.on('mouseover', () => lyr.setStyle({weight: 2.5, color: '#000'}));
      lyr.on('mouseout',  () => lyr.setStyle(styleFor(f)));
   }
 });
});

// fit to everything that ever appears
// const all = L.featureGroup(Object.values(layers));
// map.fitBounds(all.getBounds(), {padding: [20, 20]});

function show(m) {
  if (current) map.removeLayer(current);
  current = layers[m] || null;
  if (current) current.addTo(map);
  document.getElementById('month-label').textContent = MONTHS[m - 1];
  document.getElementById('nodata').style.display = current ? 'none' : 'block';
}

// slider
const slider = document.getElementById('slider');
slider.addEventListener('input', () => show(+slider.value));
let timer = null;
const playBtn = document.getElementById('play');
playBtn.addEventListener('click', () => {
  if (timer) {clearInterval(timer); timer = null; playBtn.innerHTML = '&#9654; Play'; return;}
  playBtn.innerHTML = '&#10074;&#10074;';
  timer = setInterval(() => {
    slider.value = (+slider.value % 12) + 1;
    show(+slider.value);
 }, 1200);
});

// legends never die - 'sandlot'
const legend = L.control({position: 'bottomleft'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<b>Normalized GBIF occurrences</b><div class="bar"></div><div class="lr"><span>${vmin.toFixed(3)}</span><span>${vmax.toFixed(3)}</span></div>`;
  return d;
};
legend.addTo(map);

show(1);
</script>
