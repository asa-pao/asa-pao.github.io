<style>
  :root { --ink:#222; --muted:#666; --card:#fff; --bg:#eef0ee; --accent:#b2402a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif; }
  .card { max-width:1000px; margin:20px auto; background:var(--card); border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); overflow:hidden; }
  .card h1 { margin:0; padding:16px 20px 2px; font-size:1.6rem; }
  .card .sub { padding:0 20px 12px; color:var(--muted); font-size:.95rem; }
  #map { height:600px; width:100%; }
  .controls { display:flex; align-items:center; gap:14px; padding:14px 20px; border-top:1px solid #ddd; }
  .controls label { font-weight:700; white-space:nowrap; }
  #opacity { flex:1; accent-color:var(--accent); }
  #opacity-val { min-width:42px; text-align:right; font-weight:700; }
  .legend { background:rgba(255,255,255,.92); padding:8px 10px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.3); font-size:.8rem; line-height:1.3; }
  .legend .bar { width:190px; height:12px; margin:4px 0 2px; border:1px solid #999; }
  .legend .lr { display:flex; justify-content:space-between; }
  .notice { position:absolute; z-index:1000; left:50%; top:10px; transform:translateX(-50%); background:#fff8d6; border:1px solid #d9c35a; padding:6px 12px; border-radius:6px; font-size:.85rem; display:none; }
  .mapwrap { position:relative; }
  .foot { padding:10px 20px 16px; font-size:.8rem; color:var(--muted); }
  .raster-px { image-rendering:pixelated; }
</style>
</head>

    <input id="opacity" type="range" min="0" max="1" step="0.1" aria-label="Raster opacity">
    <span id="opacity-val"></span>
  </div>
</div>

const LEGEND    = {"caption":"dNDVI","stops":["#8e0152","#cb3289","#e897c4","#fad6ea","#f7f7f6","#d9f0bc","#9acd61","#589b28","#276419"],"labels":["-1082.54","0.00","+1082.54"]};     // {caption, stops:[css colors], labels:[left, mid, right]}
const OPACITY   = 1.0;
const PIXELATED = true;  // true = hard pixel edges when zoomed in
const INIT      = {"center":[45.61249999575823,-121.17499998873123],"zoom":13.4};       // {center:[lat,lon], zoom} or null (null = fit to raster)
const RASTER_NAME = "NDVI change";
const map = L.map('map', { minZoom: 2, maxZoom: 17, zoomSnap: 0.1, worldCopyJump: true });
const openTopo = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  referrerPolicy: 'origin',
  attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
});

const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 17,
  attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, USGS, NRCAN and others'
});

let tileErrors = 0, swapped = false;

  tileErrors++;
  if (tileErrors >= 4 && !swapped) {
    swapped = true;
    map.removeLayer(openTopo);
    esriTopo.addTo(map);
    esriTopo.bringToBack();
    const n = document.getElementById('notice');
    n.textContent = 'OpenTopoMap refused the tiles (likely a 403 from opening the file directly), so the Esri topo basemap is shown instead.';

    setTimeout(() => n.style.display = 'none', 9000);
  }
});

map.createPane('raster');
map.getPane('raster').style.zIndex = 350;      // tiles = 200, vectors (overlayPane) = 400

const raster = L.imageOverlay(IMG, BOUNDS, {
  opacity: OPACITY,
  pane: 'raster',
  interactive: false,
  className: PIXELATED ? 'raster-px' : ''
}).addTo(map);

const overlays = {};

LAYERS.forEach(l => {

    interactive: false,
    style: () => ({ fill: l.fillOpacity > 0, fillOpacity: l.fillOpacity, color: l.color, weight: l.weight })

  overlays[l.name] = lyr;

  raster.setOpacity(+slider.value);
  sliderVal.textContent = Math.round(+slider.value * 100) + '%';
});

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<b>${LEGEND.caption}</b><div class="bar"></div>` +
    `<div class="lr"><span>${LEGEND.labels[0]}</span><span>${LEGEND.labels[1]}</span><span>${LEGEND.labels[2]}</span></div>`;
  d.querySelector('.bar').style.background = `linear-gradient(to right, ${LEGEND.stops.join(',')})`;
  return d;
};
legend.addTo(map);
